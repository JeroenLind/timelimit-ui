</style>
<rect width="990" height="760" fill="#ffffff"/>
<rect x="200" y="92" width="730" height="84" rx="8" class="band"/><text x="210" y="108" class="bl">1 · Entry (Flask)</text>
<rect x="200" y="196" width="730" height="84" rx="8" class="band"/><text x="210" y="212" class="bl">2 · Services (business logic)</text>
<rect x="200" y="296" width="730" height="144" rx="8" class="band"/><text x="210" y="312" class="bl">3 · Sync engine (background threads)</text>
<rect x="200" y="470" width="730" height="90" rx="8" class="band"/><text x="210" y="486" class="bl">4 · Gateways</text>
<rect x="30" y="196" width="140" height="244" rx="8" class="dom"/>
<text x="100" y="222" class="t">Domain</text>
<text x="100" y="244" class="s">pure, no I/O</text>
<text x="100" y="260" class="s"></text>
<text x="100" y="276" class="s">action_builder</text>
<text x="100" y="292" class="s">ids</text>
<text x="100" y="308" class="s">bitmask</text>
<text x="100" y="324" class="s">validation</text>
<text x="100" y="340" class="s"></text>
<text x="100" y="356" class="s">depends on</text>
<text x="100" y="372" class="s">nothing</text>
<rect x="330" y="20" width="470" height="50" rx="6" class="b"/><text x="565.0" y="40" class="t">Browser</text><text x="565.0" y="58" class="s">views · state · i18n · theme · api module</text>
<rect x="220" y="116" width="300" height="50" rx="6" class="b"/><text x="370.0" y="136" class="t">Routes</text><text x="370.0" y="154" class="s">thin: parse, call service, error envelope</text>
<rect x="640" y="116" width="260" height="50" rx="6" class="b"/><text x="770.0" y="136" class="t">SSE hub</text><text x="770.0" y="154" class="s">live updates to the browser</text>
<rect x="220" y="220" width="300" height="50" rx="6" class="b"/><text x="370.0" y="240" class="t">Rules · Category · Usage · ExtraTime</text><text x="370.0" y="258" class="s">Family · Settings · TestUser services</text>
<rect x="640" y="220" width="160" height="50" rx="6" class="b"/><text x="720.0" y="240" class="t">SyncService</text><text x="720.0" y="258" class="s">push, then pull</text>
<rect x="230" y="336" width="130" height="58" rx="6" class="b"/><text x="295.0" y="356" class="t">Socket listener</text><text x="295.0" y="374" class="s">server: should sync</text>
<rect x="372" y="336" width="130" height="58" rx="6" class="b"/><text x="437.0" y="356" class="t">Fallback poller</text><text x="437.0" y="374" class="s">+ health check</text>
<rect x="520" y="336" width="180" height="58" rx="6" class="b"/><text x="610.0" y="356" class="t">action_pusher</text><text x="610.0" y="374" class="s">sequence numbers,</text><text x="610.0" y="389" class="s">integrity</text>
<rect x="730" y="336" width="170" height="58" rx="6" class="b"/><text x="815.0" y="356" class="t">Sync worker</text><text x="815.0" y="374" class="s">one thread, job queue</text>
<rect x="330" y="494" width="230" height="52" rx="6" class="g"/><text x="445.0" y="514" class="t">Server client</text><text x="445.0" y="532" class="s">the only HTTP to the server</text>
<rect x="640" y="494" width="260" height="52" rx="6" class="g"/><text x="770.0" y="514" class="t">Repository</text><text x="770.0" y="532" class="s">the only SQL</text>
<rect x="330" y="600" width="230" height="46" rx="6" class="x"/><text x="445.0" y="620" class="t">TimeLimit server</text><text x="445.0" y="638" class="s">official, unmodified</text>
<rect x="640" y="600" width="260" height="46" rx="6" class="x"/><text x="770.0" y="620" class="t">SQLite cache</text><text x="770.0" y="638" class="s">data/ folder</text>
