<text x="378" y="86" class="lb" text-anchor="start">HTTP JSON</text>
<path d="M700 116 V70" class="ad" marker-end="url(#h)"/>
<text x="708" y="86" class="lb" text-anchor="start">events (SSE)</text>
<path d="M370 166 V220" class="a" marker-end="url(#h)"/>
<path d="M520 245 H640" class="a" marker-end="url(#h)"/>
<path d="M800 270 V336" class="a" marker-end="url(#h)"/>
<text x="808" y="306" class="lb" text-anchor="start">enqueue job</text>
<path d="M295 336 V318 H760 V336" class="a" marker-end="url(#h)"/>
<path d="M437 336 V318" class="a"/>
<path d="M730 365 H700" class="a" marker-end="url(#h)"/>
<path d="M885 336 V166" class="ad" marker-end="url(#h)"/>
<text x="893" y="189" class="lb" text-anchor="start">cache changed</text>
<path d="M200 245 H170" class="a" marker-end="url(#h)"/>
<path d="M200 390 H170" class="a" marker-end="url(#h)"/>
<path d="M930 250 H952 V520 H900" class="a" marker-end="url(#h)"/>
<text x="958" y="380" class="lb" transform="rotate(90 958 380)" text-anchor="middle">reads the cache</text>
<path d="M445 440 V494" class="a" marker-end="url(#h)"/>
<text x="453" y="459" class="lb" text-anchor="start">push / pull</text>
<path d="M770 440 V494" class="a" marker-end="url(#h)"/>
<text x="778" y="459" class="lb" text-anchor="start">store</text>
<path d="M445 546 V600" class="a" marker-end="url(#h)"/>
<text x="453" y="578" class="lb" text-anchor="start">REST</text>
<path d="M770 546 V600" class="a" marker-end="url(#h)"/>
<path d="M330 623 H295 V394" class="ad" marker-end="url(#h)"/>
<text x="287" y="585" class="lb" text-anchor="end">WebSocket</text>
<path d="M30 690 H70" class="a" marker-end="url(#h)"/><text x="80" y="694" class="lb">allowed call (downwards only)</text>
<path d="M290 690 H330" class="ad" marker-end="url(#h)"/><text x="340" y="694" class="lb">notification / event (never a call into a lower layer)</text>
<text x="30" y="720" class="lb">Rule: calls go downwards only. Routes never touch SQL or the server. Services reach SQL only through the Repository and never</text>
<text x="30" y="736" class="lb">talk to the server; only the Sync engine does, through the Server client. The Domain is pure and depends on nothing.</text>
</svg>