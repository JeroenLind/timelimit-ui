<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Server Time</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            font-weight: 600;
        }
        
        .time-display {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .time-display span {
            font-size: 48px;
            font-weight: 300;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }
        
        .time-display .label {
            color: #888;
            font-size: 14px;
            margin-top: 10px;
        }
        
        .check-btn {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .check-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        .check-btn:active {
            transform: translateY(0);
        }
        
        .check-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #aaa;
        }
        
        .error-message {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-top: 15px;
            color: #ff4444;
            font-size: 13px;
        }
        
        .loading {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⏱️ Check Server Time</h1>
        
        <div class="time-display">
            <span id="time-value">--:--:--</span>
            <div class="label">Server Time</div>
        </div>
        
        <button class="check-btn" id="check-btn">Check Server Time</button>
        
        <div class="status" id="status"></div>
        
        <div class="error-message" id="error-msg" style="display: none;"></div>
    </div>

    <script>
        const timeDisplay = document.getElementById('time-value');
        const checkBtn = document.getElementById('check-btn');
        const statusEl = document.getElementById('status');
        const errorEl = document.getElementById('error-msg');
        
        function formatTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleTimeString();
        }
        
        async function checkServerTime() {
            // Reset state
            checkBtn.disabled = true;
            checkBtn.textContent = 'Checking...';
            timeDisplay.textContent = '--:--:--';
            statusEl.textContent = '';
            errorEl.style.display = 'none';
            
            try {
                const response = await fetch('/api/time', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({}),
                    cache: 'no-store'
                });
                
                const data = await response.json();
                
                if (!response.ok || data.status === 'error') {
                    const errorCode = data.error_code || 'unknown';
                    const userMessage = data.user_message || 'An unexpected error occurred';
                    const technicalDetail = data.technical_detail || 'No technical details available';
                    
                    statusEl.textContent = `Error: ${userMessage}`;
                    errorEl.textContent = `Technical: ${technicalDetail}`;
                    errorEl.style.display = 'block';
                } else if (data && typeof data.time === 'number') {
                    const serverTime = new Date(data.time);
                    timeDisplay.textContent = serverTime.toLocaleTimeString();
                    statusEl.textContent = 'Server is reachable';
                } else {
                    throw new Error('Invalid response format');
                }
            } catch (e) {
                statusEl.textContent = 'Connection failed';
                errorEl.textContent = `Error: ${e.message}`;
                errorEl.style.display = 'block';
            } finally {
                checkBtn.disabled = false;
                checkBtn.textContent = 'Check Server Time';
            }
        }
        
        checkBtn.addEventListener('click', checkServerTime);
        
        // Initial check
        checkServerTime();
    </script>
</body>
</html>
