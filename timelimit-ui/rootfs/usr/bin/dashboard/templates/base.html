<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TimeLimit Dashboard</title>
  <script src="{{ url_for('static', filename='js/early-theme.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
  <script type="application/json" id="timings">{{ timings | tojson }}</script>
</head>
<body>
  <header class="topbar">
    <button type="button" class="menu-toggle" id="menu-toggle" aria-controls="sidebar" aria-expanded="false" data-i18n-aria="nav.menu">&#9776;</button>
    <h1 class="app-title" data-i18n="app.title">TimeLimit Dashboard</h1>
  </header>
  <div class="overlay" id="nav-overlay" hidden></div>
  <div class="shell">
    <nav class="sidebar" id="sidebar" aria-label="Main" data-i18n-aria="nav.main">
      <button type="button" class="nav-close" id="nav-close" data-i18n="nav.close">Close menu</button>
      <a class="nav-link" href="/" data-i18n="nav.overview">Overview</a>
      <a class="nav-link" href="/settings" data-i18n="nav.settings">Settings</a>
    </nav>
    <main class="content">
      <div id="server-banner" class="banner" role="status" aria-live="polite" hidden data-state="unknown">
        <span id="server-banner-text"></span>
        <button type="button" id="retry-connection" data-i18n="banner.retry">Retry connection</button>
      </div>
      <p id="action-status" class="action-status" role="status" aria-live="polite" hidden></p>
      <div id="notices" aria-live="polite"></div>
      {% block content %}{% endblock %}
    </main>
  </div>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <h2 id="confirm-title" data-dialog-title></h2>
    <p id="confirm-message" data-dialog-message></p>
    <div class="dialog-actions">
      <button type="button" class="secondary" data-dialog-cancel></button>
      <button type="button" data-dialog-ok></button>
    </div>
  </dialog>
  <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
