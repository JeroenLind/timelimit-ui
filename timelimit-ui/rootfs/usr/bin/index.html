<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeLimit UI - Choose Mode</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        
        h1 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: 600;
        }
        
        .subtitle {
            color: #888;
            margin-bottom: 40px;
            font-size: 16px;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .option-btn {
            padding: 20px;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .option-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        .option-btn:active {
            transform: translateY(0);
        }
        
        .option-btn.dashboard {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }
        
        .option-btn.dashboard:hover {
            box-shadow: 0 6px 20px rgba(17, 153, 142, 0.4);
        }
        
        .option-btn.check-server {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .option-btn.check-server:hover {
            box-shadow: 0 6px 20px rgba(240, 147, 251, 0.4);
        }
        
        .icon {
            font-size: 32px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⏱️ TimeLimit UI</h1>
        <p class="subtitle">Choose your starting page:</p>
        
        <div class="options">
            <button class="option-btn dashboard" onclick="window.location.href='/dashboard.html'">
                <div class="icon">🏠</div>
                Dashboard
                <div style="font-size:12px; opacity:0.8; margin-top:5px;">Open the main dashboard</div>
            </button>
            
            <button class="option-btn check-server" onclick="window.location.href='/check-server'">
                <div class="icon">🔍</div>
                Check Server
                <div style="font-size:12px; opacity:0.8; margin-top:5px;">Test server connectivity</div>
            </button>
        </div>
    </div>

    <script>
        // Auto-focus on first button for accessibility
        document.querySelector('.option-btn.dashboard').focus();
    </script>
</body>
</html>
